# Panneau d'administration (Decap CMS) — accessible sur /admin/
# À FAIRE lors de la mise en ligne : remplacer "ManuIlRe/vierge-des-pauvres" (voir LISEZMOI.md)
backend:
  name: github
  repo: ManuIlRe/vierge-des-pauvres
  branch: main

# Permet de tester le panneau sur son ordinateur avec « npm run cms »
local_backend: true

locale: fr
media_folder: src/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: activites
    label: Activités
    label_singular: Activité
    folder: src/activites
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { name: image, label: Photo principale, widget: image, required: false }
      - { name: resume, label: Résumé (une ou deux phrases), widget: text, required: false }
      - { name: body, label: Texte, widget: markdown }
      - name: photos
        label: "Photos (pour en ajouter plusieurs : Téléverser, puis sélectionner tous les fichiers)"
        widget: image
        required: false
        media_library: { config: { multiple: true } }
      - { name: video, label: Lien YouTube (facultatif), widget: string, required: false }

  - name: pages
    label: Pages
    files:
      - name: chemin
        label: Le Chemin néocatéchuménal
        file: src/le-chemin.md
        fields:
          - { name: layout, widget: hidden, default: page.njk }
          - { name: permalink, widget: hidden, default: /le-chemin/ }
          - { name: title, label: Titre, widget: string }
          - { name: chapeau, label: Sous-titre, widget: string, required: false }
          - { name: body, label: Texte, widget: markdown }

  - name: reglages
    label: Informations et réglages
    files:
      - name: accueil
        label: "Page d'accueil"
        file: src/_data/accueil.json
        fields:
          - { name: citation, label: "Citation (en haut de page)", widget: text, required: false }
          - { name: citation_auteur, label: "Auteur de la citation", widget: string, required: false }
          - { name: bouton_1, label: "Bouton vers « Le Chemin »", widget: string, required: false }
          - { name: bouton_2, label: "Bouton vers « Contact »", widget: string, required: false }
          - { name: icone, label: "Grande image en haut à droite", widget: image, required: false }
          - { name: icone_description, label: "Description de cette image", widget: string, required: false }
          - { name: medaillon, label: "Médaillon rond", widget: image, required: false }
          - { name: medaillon_description, label: "Description du médaillon", widget: string, required: false }
          - { name: texte, label: "Texte d'accueil", widget: text }
          - { name: tripode_titre, label: "Tripode — titre", widget: string }
          - name: tripode
            label: "Tripode — encadrés"
            label_singular: encadré
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
          - { name: horaires_titre, label: "Titre de la section horaires", widget: string }
          - { name: acces_titre, label: "Titre de la section adresse", widget: string }
          - { name: photos_titre, label: "Titre du diaporama", widget: string }
          - { name: activites_titre, label: "Titre des activités", widget: string }
          - { name: activites_nombre, label: "Nombre d'activités affichées", widget: number, value_type: int, min: 1, max: 9, default: 3 }
          - name: sections
            label: "Sections (glisser pour changer l'ordre, supprimer pour masquer)"
            label_singular: section
            widget: list
            field:
              name: section
              label: Section
              widget: select
              options:
                - { label: "Texte d'accueil et médaillon", value: intro }
                - { label: "Tripode", value: tripode }
                - { label: "Horaires et adresse", value: horaires }
                - { label: "Diaporama de photos", value: photos }
                - { label: "Activités récentes", value: activites }
      - name: site
        label: Paroisse, horaires, contact
        file: src/_data/site.json
        fields:
          - { name: nom, label: Nom, widget: string }
          - { name: sous_titre, label: Sous-titre, widget: string }
          - { name: adresse, label: Adresse, widget: text }
          - { name: lien_carte, label: Lien vers la carte, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: telephone, label: Téléphone, widget: string }
          - { name: presbytre, label: Presbytre, widget: string }
          - { name: photo_eglise, label: Photo de l'église, widget: image, required: false }
          - name: horaires
            label: Horaires
            label_singular: Horaire
            widget: list
            summary: "{{fields.jour}} {{fields.heure}}"
            fields:
              - { name: jour, label: Jour, widget: string }
              - { name: heure, label: Heure, widget: string }
              - { name: description, label: Description, widget: string }
      - name: histoire
        label: Notre histoire
        file: src/_data/histoire.json
        fields:
          - name: etapes
            label: Étapes
            label_singular: Étape
            widget: list
            summary: "{{fields.annee}}"
            fields:
              - { name: annee, label: Année, widget: string }
              - { name: texte, label: Texte, widget: text }
      - name: galerie
        label: Photos et vidéos
        file: src/_data/galerie.json
        fields:
          - name: photos
            label: "Photos (pour en ajouter plusieurs : Téléverser, puis sélectionner tous les fichiers)"
            widget: image
            required: false
            media_library: { config: { multiple: true } }
          - name: videos
            label: Vidéos
            label_singular: Vidéo
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { name: titre, label: Titre, widget: string }
              - { name: url, label: Lien YouTube, widget: string }
