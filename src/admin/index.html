<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration — Vierge des Pauvres</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script>
    // Téléversement de plusieurs photos à la fois.
    // Decap n'envoie qu'un fichier par sélection et n'en insère qu'un à la fois :
    // on autorise la sélection multiple, on lui transmet les fichiers un par un et,
    // pour un champ à plusieurs photos, on insère chaque photo dès qu'elle est envoyée.
    const pause = (ms) => new Promise((r) => setTimeout(r, ms));
    const champ = () => document.querySelector("input[type=file]");
    const libelle = () => (champ()?.closest("label, button") || champ()?.parentElement)?.textContent.trim();
    const bouton = (racine, motif) => [...racine.querySelectorAll("button")].find((b) => motif.test(b.textContent));
    const attendre = async (test, essais = 100) => { for (let i = 0; i < essais * 2 && !test(); i++) await pause(50); return test(); };

    // Les photos d'appareil ou de téléphone sont réduites avant l'envoi (2000 px au plus) :
    // envoi et publication bien plus rapides, pages plus légères pour les visiteurs.
    const COTE_MAX = 2000;
    const alleger = async (fichier) => {
      if (fichier.type !== "image/jpeg") return fichier;
      try {
        const image = await createImageBitmap(fichier, { imageOrientation: "from-image" });
        const echelle = Math.min(1, COTE_MAX / Math.max(image.width, image.height));
        if (echelle === 1 && fichier.size < 700000) return fichier;
        const toile = document.createElement("canvas");
        toile.width = Math.round(image.width * echelle);
        toile.height = Math.round(image.height * echelle);
        toile.getContext("2d").drawImage(image, 0, 0, toile.width, toile.height);
        const blob = await new Promise((r) => toile.toBlob(r, "image/jpeg", 0.85));
        if (!blob || blob.size >= fichier.size) return fichier;
        console.info("Photo allégée :", fichier.name, Math.round(fichier.size / 1024) + " Ko →", Math.round(blob.size / 1024) + " Ko");
        return new File([blob], fichier.name, { type: "image/jpeg" });
      } catch { return fichier; }
    };

    new MutationObserver(() => {
      document.querySelectorAll("input[type=file]").forEach((i) => { i.multiple = true; });
    }).observe(document.body, { childList: true, subtree: true });

    // On retient le champ depuis lequel la bibliothèque a été ouverte
    let ouvreur = null;
    document.addEventListener("click", (e) => {
      const b = e.target.closest?.("button");
      if (!b || champ()) return;
      const multiple = /images/i.test(b.textContent) && !/remove|supprimer/i.test(b.textContent);
      const parents = [];
      for (let n = b.parentElement; n && parents.length < 6; n = n.parentElement) parents.push(n);
      ouvreur = { multiple, parents };
    }, true);
    const rouvrir = async () => {
      const zone = ouvreur.parents.find((n) => n.isConnected && bouton(n, /add more images|choose images|choisir des images/i));
      if (!zone) return false;
      bouton(zone, /add more images|choose images|choisir des images/i).click();
      return attendre(champ);
    };

    document.addEventListener("change", async (e) => {
      const input = e.target;
      if (!(input instanceof HTMLInputElement) || input.type !== "file") return;
      if (input.dataset.lot || input.files.length < 1) return;
      e.stopImmediatePropagation();
      const fichiers = [...input.files];
      const inserer = !!ouvreur?.multiple && fichiers.length > 1;
      const repos = libelle();
      for (const [n, fichier] of fichiers.entries()) {
        const cible = champ();
        if (!cible) break;
        const dt = new DataTransfer();
        dt.items.add(await alleger(fichier));
        cible.files = dt.files;
        cible.dataset.lot = "1";
        cible.dispatchEvent(new Event("change", { bubbles: true }));
        delete cible.dataset.lot;
        // Le bouton change de texte pendant l'envoi, puis revient à son texte habituel
        await attendre(() => libelle() !== repos, 20);
        await attendre(() => libelle() === repos, 1200);
        await pause(100);
        if (!inserer) continue;
        const choisir = bouton(document, /choisir les éléments|choose selected/i);
        if (!choisir || choisir.disabled) break;
        choisir.click();
        await attendre(() => !champ());
        if (n < fichiers.length - 1 && !(await rouvrir())) break;
      }
    }, true);
  </script>
</body>
</html>
